name: Reduced CPU model run

on:
  workflow_dispatch:
    inputs:
      detector_profile:
        description: "Choose the standard reduced run or an opt-in detector training probe"
        type: choice
        required: true
        default: standard
        options:
          - standard
          - validation_probe_10_epoch
  push:
    branches:
      - main
    paths-ignore:
      - RESULTS.md
      - README.md
      - results/**
      - docs/**

permissions:
  contents: write

concurrency:
  group: reduced-cpu-main
  cancel-in-progress: false

jobs:
  reduced-cpu-run:
    name: Reduced CPU training and evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      PYTHONUNBUFFERED: "1"
      WANDB_MODE: disabled
    steps:
      - name: Check out main using the built-in workflow token
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cpu-run.txt

      - name: Install pinned CPU-only dependencies
        id: install
        run: |
          python -m pip install pip==24.3.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements-cpu-run.txt
          python -m pip install --no-deps -e .

      - name: Fetch and verify pinned YOLOv5 source
        id: yolo
        env:
          YOLO_DIR: ${{ runner.temp }}/yolov5-pinned
        run: |
          git clone --filter=blob:none https://github.com/ultralytics/yolov5.git "$YOLO_DIR"
          git -C "$YOLO_DIR" checkout --detach f9578796b8a64889aa9e66dc06914d19f40d338e
          test "$(git -C "$YOLO_DIR" rev-parse HEAD)" = "f9578796b8a64889aa9e66dc06914d19f40d338e"

      - name: Run unit tests and CPU smoke test first
        id: tests
        run: |
          python -m pytest -q
          python scripts/smoke_test.py

      - name: Verify GitHub Actions can write results
        id: write_check
        run: |
          set -euo pipefail
          probe="actions-write-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { git push origin --delete "$probe" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          if ! git push origin "HEAD:refs/heads/$probe"; then
            echo "::error::GITHUB_TOKEN could not create a temporary branch. In repository settings, open Settings > Actions > General > Workflow permissions and select Read and write permissions."
            echo "Workflow write preflight failed. Check Settings > Actions > General > Workflow permissions and select Read and write permissions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push origin --delete "$probe"
          trap - EXIT

      - name: Verify minimum-box visibility at -5 dB over 50 seeds
        id: visibility
        env:
          VISIBILITY_DIR: ${{ runner.temp }}/visibility-check
        run: |
          python scripts/visibility_check.py --seeds 50 --seed-start 0 --snr-db -5 --n-samples 1000000 --output-dir "$VISIBILITY_DIR"

      - name: Train reduced models and evaluate frozen test sets
        id: pipeline
        env:
          RUN_DIR: ${{ runner.temp }}/wideband-reduced-run
          DATA_WORK: ${{ runner.temp }}/wideband-reduced-data
          YOLO_DIR: ${{ runner.temp }}/yolov5-pinned
          DETECTOR_PROFILE: ${{ inputs.detector_profile || 'standard' }}
        run: |
          case "$DETECTOR_PROFILE" in
            standard)
              CONFIG_PATH="configs/reduced_cpu.yaml"
              YOLO_EPOCHS=3
              ;;
            validation_probe_10_epoch)
              CONFIG_PATH="configs/reduced_cpu_yolo_10_epoch_probe.yaml"
              YOLO_EPOCHS=10
              ;;
            *)
              echo "::error::Unknown detector profile: $DETECTOR_PROFILE"
              exit 2
              ;;
          esac
          echo "Detector profile: $DETECTOR_PROFILE ($YOLO_EPOCHS YOLO epochs)" >> "$GITHUB_STEP_SUMMARY"
          python scripts/run_milestone2.py \
            --config "$CONFIG_PATH" \
            --yolo-dir "$YOLO_DIR" \
            --out-dir "$RUN_DIR" \
            --data-work "$DATA_WORK" \
            --recordings 18 \
            --shift-recordings 4 \
            --segments-per-recording 1 \
            --yolo-epochs "$YOLO_EPOCHS" \
            --yolo-batch 2 \
            --pam-epochs 5 \
            --pam-batch 32 \
            --bootstrap-iterations 200 \
            --device cpu \
            --runtime-budget-minutes 210 \
            --pam-training-budget-minutes 15 \
            --evaluation-reserve-minutes 45 \
            --run-label "reduced run: CPU, small data, not comparable to target"

      - name: Fast-forward main before publishing results
        id: sync
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - name: Publish measured results to README and RESULTS
        id: publish
        env:
          RUN_DIR: ${{ runner.temp }}/wideband-reduced-run
        run: |
          python scripts/publish_reduced_results.py --run-dir "$RUN_DIR"

      - name: Add and commit measured results
        id: commit
        run: |
          git config user.name "ps-narayan"
          git config user.email "188357719+ps-narayan@users.noreply.github.com"
          git add README.md RESULTS.md results/reduced_cpu
          if git diff --cached --quiet; then
            echo "No measured-result changes to commit."
          else
            git commit -m "Record measured reduced CPU results [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload run metrics, plots, visibility report, and logs
        id: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reduced-cpu-run-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/wideband-reduced-run/results/**
            ${{ runner.temp }}/wideband-reduced-run/checkpoints/**
            ${{ runner.temp }}/wideband-reduced-run/plots/*.png
            ${{ runner.temp }}/visibility-check/visibility_summary.json
            ${{ runner.temp }}/visibility-check/worst_seed_spectrogram.png

      - name: Report the failing step clearly
        if: failure()
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          PYTHON_RESULT: ${{ steps.python.outcome }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          YOLO_RESULT: ${{ steps.yolo.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
          VISIBILITY_RESULT: ${{ steps.visibility.outcome }}
          WRITE_RESULT: ${{ steps.write_check.outcome }}
          PIPELINE_RESULT: ${{ steps.pipeline.outcome }}
          SYNC_RESULT: ${{ steps.sync.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          COMMIT_RESULT: ${{ steps.commit.outcome }}
          ARTIFACTS_RESULT: ${{ steps.artifacts.outcome }}
        run: |
          {
            echo "## Reduced CPU run failed"
            echo
            echo "Step outcomes (the first \`failure\` identifies where to inspect):"
            echo "- checkout: $CHECKOUT_RESULT"
            echo "- Python setup: $PYTHON_RESULT"
            echo "- dependency install: $INSTALL_RESULT"
            echo "- YOLOv5 pin verification: $YOLO_RESULT"
            echo "- tests: $TESTS_RESULT"
            echo "- Actions write permission preflight: $WRITE_RESULT"
            echo "- visibility check: $VISIBILITY_RESULT"
            echo "- training/evaluation: $PIPELINE_RESULT"
            echo "- fast-forward main before publication: $SYNC_RESULT"
            echo "- measured-result publication: $PUBLISH_RESULT"
            echo "- commit/push: $COMMIT_RESULT"
            echo "- artifact upload: $ARTIFACTS_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Reduced CPU workflow failed. Review the first failed step in the job log and the step-outcomes summary."
          if [ "$WRITE_RESULT" = "failure" ]; then
            echo "If the write preflight failed, open repository Settings > Actions > General > Workflow permissions and select Read and write permissions." >> "$GITHUB_STEP_SUMMARY"
          fi
